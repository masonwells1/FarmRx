# CodeRabbit configuration for Farm Rx
# Docs: https://docs.coderabbit.ai/reference/configuration
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US

# "chill" = fewer style nitpicks, focus on real problems. Mason is a solo,
# non-coder owner; signal matters more than volume.
reviews:
  profile: chill
  # A manual final review must produce a formal APPROVED/CHANGES_REQUESTED
  # review so GitHub can enforce the exact-candidate approval gate.
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  # Report sections (sequence diagrams, related PRs/issues, linked-issue
  # assessment, suggested labels/reviewers, changed-files summary) are left at
  # their defaults - ON. Mason's call, 2026-08-20: he raised the CodeRabbit
  # usage spending cap rather than trade any possible review context for a
  # cheaper report. Deliberate: do not turn these off to save spend.

  # Skip churn that cannot contain a bug. FarmRx shares one CodeRabbit org (and
  # one review budget) with CRX Manager, so wasted attempts here throttle both.
  #
  # Lock files need a POSITIVE pattern: CodeRabbit's default ignore list
  # already covers package-lock.json and deno.lock, and only an explicit
  # include overrides a default exclusion. Without it a lockfile-only PR has
  # zero reviewable files and is skipped, so nothing inspects version bumps or
  # integrity hashes - and this repo has shipped deno.lock as its sole
  # functional change before.
  #
  # The leading `**` is load-bearing, do not remove it. Listing the lockfiles
  # alone (this PR, round 2) made CodeRabbit answer "No files to review": once
  # ANY positive pattern exists, only files matching a positive pattern are
  # reviewed, so every ordinary source file was dropped. `**` restores the
  # default-include breadth; the lockfile patterns then act purely as overrides
  # of CodeRabbit's built-in ignores.
  #
  # CRX Manager deliberately does NOT carry this include - it stays
  # exclusion-only there until this form is proven on a review here.
  #
  # The `**` above opts OUT of CodeRabbit's curated default ignore list, so the
  # categories it used to drop for free - dependencies, build output, binaries,
  # media, source maps, generated code - have to be excluded by hand here.
  # Leaving them in would inflate every review and re-create the budget problem
  # this config exists to fix.
  path_filters:
    - "**"
    - "**/package-lock.json"
    - "deno.lock"
    - "!docs/archive/**"
    - "!docs/audits/**"
    - "!docs/handoffs/**"
    - "!test-results/**"
    - "!dist/**"
    - "!**/node_modules/**"
    - "!**/build/**"
    - "!**/generated/**"
    - "!**/__generated__/**"
    - "!**/*.min.js"
    - "!**/*.map"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.gif"
    - "!**/*.ico"
    - "!**/*.webp"
    - "!**/*.svg"
    - "!**/*.woff"
    - "!**/*.woff2"
    - "!**/*.ttf"
    - "!**/*.eot"

  auto_review:
    # Mason alone starts a review by personally posting `@coderabbitai review`
    # on the frozen pull request. PR creation, pushes, labels, descriptions,
    # and GitHub workflows must never start a review automatically.
    enabled: false
    auto_incremental_review: false
    drafts: false
    # An empty list prevents any label from opting a pull request into review.
    labels: []
    # Keep description opt-in disabled; the owner's PR comment is the only trigger.
    description_keyword: ""

  # Project-specific review guidance so CodeRabbit flags Farm Rx's real risk
  # areas. The durable source detail lives in the agent development guide.
  path_instructions:
    - path: "supabase/migrations/**"
      instructions: >-
        PostgreSQL migrations for Farm Rx (a customer-facing farm app on its
        OWN Supabase project — never the CRX Manager database). Rule #2 of this
        project: grain and financial data defaults to PRIVATE and must be
        enforced with Row Level Security, not just the UI. Flag as high
        severity: any new table that does NOT enable RLS with policies in the
        same migration; any SECURITY DEFINER function missing
        `SET search_path = public, pg_temp`; any function that lets the
        `authenticated` or `anon` role reach data belonging to another farm;
        any server-only path (push delivery, scheduled sweeps) that does not
        actually verify it is running as service_role. Money must be integer
        cents / defined precision — never floating point.
    - path: "src/**"
      instructions: >-
        React + TypeScript (Vite) PWA for farmers on phones. Flag: any
        hardcoded secret, service-role key, or private key in client code
        (only publishable/anon and VAPID PUBLIC keys belong here); money handled
        as floating point instead of integer cents; grain quantity logic that
        overwrites `expected_bushels` with `actual_bushels` (both must be kept
        separately); treating a crop as a column on a field instead of its own
        `field_id + year + crop` row (double-crop soybeans break the column
        model); and merging white corn / non-GMO corn with yellow corn (they
        are distinct marketable commodities).
    - path: "supabase/functions/**"
      instructions: >-
        Supabase Edge Functions (Deno). Secrets (SUPABASE_SERVICE_ROLE_KEY,
        VAPID_PRIVATE_KEY, RESEND_API_KEY, SCHEDULER_SECRET) must come from
        Deno.env only and must never be logged or returned to the client. Flag
        any hardcoded secret value and any service-role client that is exposed
        to an unauthenticated caller.

# Teach CodeRabbit this repo's own written rules so it reviews against the
# actual house standard instead of only the path instructions above.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "docs/agent-development-guide.md"
      - "docs/agent-delivery.md"

chat:
  auto_reply: true
