name: Verify manual-only CodeRabbit configuration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-manual-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify CodeRabbit cannot be requested automatically
        run: node scripts/check-agent-guidance.mjs
