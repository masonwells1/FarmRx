name: Farm Rx foundation gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # These three gates are invoked by the WORKFLOW, not by the orchestrator, and that is the entire
      # point of listing them separately. A single earlier attempt to solve this asserted the
      # orchestrator's final marker from here, on the reasoning that a script which returns early cannot
      # keep the last line it prints. That reasoning was wrong: an edit reading
      # `Write-Output ('Farm Rx foundation gate: ' + 'PASS'); return` at the top prints the marker
      # without running anything, and a substring assertion over a log the script itself writes cannot
      # tell the two apart. No log-string check can, because the liar writes the log. Running the guards
      # as their own steps is the difference that holds: a forged orchestrator cannot suppress a step it
      # does not invoke.
      - name: Foundation static guards
        run: node scripts/foundation-static-guards.mjs
      - name: Foundation mutation drill
        run: node scripts/verify-foundation-mutations.mjs
      - name: Windows execution lane runtime drill
        run: node scripts/foundation-windows-lane-runtime-drill.mjs
      # The kill-authorizing predicate's BEHAVIOUR, run here because the two guards above cannot see it.
      # Measured on the author's workstation: inserting `return $true` at the top of
      # Test-MapleSeasonBrowserPortOwned - which authorizes killing every listener on the governed port,
      # including a foreign one - left both `foundation-static-guards.mjs` and
      # `verify-foundation-mutations.mjs` printing PASS with all of their mutations detected, because every
      # pinned string was still present and only the behaviour was gone. Pinning text is a restatement of
      # "the code still works" and fails the same way the predicate did. This step calls the predicate.
      # It runs on ubuntu because its expectations were measured from CommandLineToArgvW on Windows and
      # then hard-coded, and because containment refusals do not need a Windows path resolver to prove:
      # gutted, the predicate fails 25 of this suite's cases here. The must-be-TRUE half is skipped off
      # Windows, where a Windows-shaped root cannot resolve inside itself, and is covered by the
      # Windows-only socket regression the orchestrator chains.
      - name: Season browser ownership regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The marker alone was measured to be satisfiable by a two-line file that prints it and exits 0, so
          # this step also challenges the suite with command lines whose answers are written out here. The
          # expectations are longhand in both callers on purpose: a challenge is only a challenge if the party
          # asking holds the answer independently. Row 1 is the live unrelated Node process that holds this
          # port on the author's workstation and must never be judged ours - FALSE in every world, as are rows
          # 2 and 3, each refused before the platform path resolver is consulted or by prefix arithmetic no
          # resolver changes. Row 0 is `ResolverDependent`: TRUE on Windows, and off Windows this step requires
          # the exact argv and requires an answer, but does not claim which verdict is right, because nobody
          # has measured .NET's GetFullPath on Linux against this predicate. This job is ubuntu-latest, so that
          # unclaimed case is the one that applies here, and the manifest states which world ran.
          $rows = @(
            @{ Line = 'node.exe C:\FarmRx\node_modules\vite\bin\vite.js --port 4177'; Argv = '<node.exe>|<C:\FarmRx\node_modules\vite\bin\vite.js>|<--port>|<4177>'; Owned = $true; ResolverDependent = $true }
            @{ Line = '"C:\Program Files\nodejs\node.exe" scripts/factory-board.mjs --port 4177'; Argv = '<C:\Program Files\nodejs\node.exe>|<scripts/factory-board.mjs>|<--port>|<4177>'; Owned = $false; ResolverDependent = $false }
            @{ Line = 'node.exe "C:\FarmRx"" Backup"\x.js'; Argv = '<node.exe>|<C:\FarmRx">|<Backup\x.js>'; Owned = $false; ResolverDependent = $false }
            @{ Line = 'node.exe C:\FarmRx2\node_modules\vite\bin\vite.js'; Argv = '<node.exe>|<C:\FarmRx2\node_modules\vite\bin\vite.js>'; Owned = $false; ResolverDependent = $false }
          )
          $onWindows = ($null -eq $IsWindows) -or $IsWindows
          # U+001F-joined then Base64 encoded, the same encoding the orchestrator uses. This step calls the suite
          # in-process, so it never hit the `-File` binder defects the encoding exists to survive - it matches
          # the orchestrator anyway, because two callers that encode differently would let a decode regression
          # pass on one side and fail on the other.
          $challenge = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes((($rows | ForEach-Object { $_.Line }) -join ([char]0x1F))))
          $ownership = @(./scripts/maple-season-browser-ownership.regression.ps1 -Challenge $challenge -ChallengeRoot 'C:\FarmRx')
          $ownership | ForEach-Object { Write-Output $_ }
          if ($ownership -notcontains 'MAPLE_SEASON_BROWSER_OWNERSHIP_REGRESSION_PASS') {
            throw 'Season browser ownership regression did not print its completion marker.'
          }
          $manifest = @($ownership | Where-Object { $_ -like 'OWNERSHIP_MANIFEST *' })
          if ($manifest.Count -ne 1) { throw "Season browser ownership regression printed $($manifest.Count) manifest lines instead of exactly one; it did not run to completion." }
          $expected = "OWNERSHIP_MANIFEST tokenizer=29 refusals=25 gutted=25 windows=$($onWindows.ToString().ToLowerInvariant()) windowsCases=$(if ($onWindows) { 24 } else { 0 }) challenges=$($rows.Count)"
          if ($manifest[0] -cne $expected) { throw "Season browser ownership regression reported a different shape than this step requires.`n  expected: $expected`n  reported: $($manifest[0])" }
          for ($i = 0; $i -lt $rows.Count; $i++) {
            $verdicts = if ($rows[$i].ResolverDependent -and (-not $onWindows)) { @('TRUE', 'FALSE') } elseif ($rows[$i].Owned) { @('TRUE') } else { @('FALSE') }
            $candidates = @($verdicts | ForEach-Object { "OWNERSHIP_CHALLENGE $i owned=$_ argv=$($rows[$i].Argv)" })
            $matched = @($candidates | Where-Object { $ownership -ccontains $_ })
            if ($matched.Count -ne 1) {
              throw "Season browser ownership regression did not answer challenge $i as this step requires.`n  accepted: $($candidates -join ' OR ')`n  command line: $($rows[$i].Line)"
            }
          }
      - name: Run foundation gate
        shell: pwsh
        # The marker assertion stays, downgraded in what it claims. It catches a truncated or crashed run
        # that still exits 0; it does not catch a deliberate forgery, and the steps above are what cover
        # that. Tee-Object passes the output through, so the gate still streams to the job log.
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/verify-foundation.ps1 | Tee-Object -FilePath foundation-gate.log
          if (-not (Select-String -LiteralPath foundation-gate.log -SimpleMatch -CaseSensitive -Pattern 'Farm Rx foundation gate: PASS' -Quiet)) {
            throw 'Foundation gate did not print its completion marker.'
          }
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
