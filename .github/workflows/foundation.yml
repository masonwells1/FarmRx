name: Farm Rx foundation gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # These three gates are invoked by the WORKFLOW, not by the orchestrator, and that is the entire
      # point of listing them separately. A single earlier attempt to solve this asserted the
      # orchestrator's final marker from here, on the reasoning that a script which returns early cannot
      # keep the last line it prints. That reasoning was wrong: an edit reading
      # `Write-Output ('Farm Rx foundation gate: ' + 'PASS'); return` at the top prints the marker
      # without running anything, and a substring assertion over a log the script itself writes cannot
      # tell the two apart. No log-string check can, because the liar writes the log. Running the guards
      # as their own steps is the difference that holds: a forged orchestrator cannot suppress a step it
      # does not invoke.
      - name: Foundation static guards
        run: node scripts/foundation-static-guards.mjs
      # This step HOLDS THE DRILL'S OWN CLAIM as well as its exit code. A zero exit does not say how much of
      # the drill ran: its whole behavioural half can be wrapped in `if (false) { ... }` with every pinned
      # string still present, and the summary line used to print before the section it summarizes. Both markers
      # now print last and this step requires the behavioural one longhand. The count is FOUR here, not five,
      # and the difference is not cosmetic: the fifth case needs the suite's Windows-only must-be-TRUE table,
      # so on ubuntu it is a measured gap this step requires the drill to declare rather than a detection.
      - name: Foundation mutation drill
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $drill = @(node scripts/verify-foundation-mutations.mjs)
          $drill | ForEach-Object { Write-Output $_ }
          if ($LASTEXITCODE -ne 0) { throw 'Foundation mutation drill failed.' }
          # The STATIC half is held here too. A fresh-context review observed that all of its mutations could be
          # wrapped whole while the behavioural half still earned its own sentence, because no caller was
          # reading the static marker at all. A marker nobody consumes is decoration.
          $expectedStatic = 'Foundation mutation drill: PASS (262 controlled mutations turned the gate red)'
          if ($drill -cnotcontains $expectedStatic) {
            throw "Foundation mutation drill did not report its static half to this job.`n  expected: $expectedStatic"
          }
          $expectedBehaviour = 'Foundation behavioural mutation drill: PASS (4 broken subjects were reported by the suite that runs against them, 1 not measurable on this platform)'
          if ($drill -cnotcontains $expectedBehaviour) {
            throw "Foundation mutation drill did not report its behavioural half to this job.`n  expected: $expectedBehaviour"
          }
          # A drill that prints BOTH platforms' claims is satisfying its callers rather than measuring them.
          $rejectedBehaviour = 'Foundation behavioural mutation drill: PASS (5 broken subjects were reported by the suite that runs against them, 0 not measurable on this platform)'
          if ($drill -ccontains $rejectedBehaviour) {
            throw "Foundation mutation drill reported BOTH platforms' behavioural claims, so at least one of them is not a measurement.`n  unexpected: $rejectedBehaviour"
          }
      - name: Windows execution lane runtime drill
        run: node scripts/foundation-windows-lane-runtime-drill.mjs
      # The kill-authorizing predicate's BEHAVIOUR, run here because the two guards above cannot see it.
      # Measured on the author's workstation: inserting `return $true` at the top of
      # Test-MapleSeasonBrowserPortOwned - which authorizes killing every listener on the governed port,
      # including a foreign one - left both `foundation-static-guards.mjs` and
      # `verify-foundation-mutations.mjs` printing PASS with all of their mutations detected, because every
      # pinned string was still present and only the behaviour was gone. Pinning text is a restatement of
      # "the code still works" and fails the same way the predicate did. This step calls the predicate.
      # It runs on ubuntu because its expectations were measured from CommandLineToArgvW on Windows and
      # then hard-coded, and because containment refusals do not need a Windows path resolver to prove:
      # gutted, the predicate fails 25 of this suite's cases here. The must-be-TRUE half is skipped off
      # Windows, where a Windows-shaped root cannot resolve inside itself, and is covered by the
      # Windows-only socket regression the orchestrator chains.
      - name: Season browser ownership regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The marker alone was measured to be satisfiable by a two-line file that prints it and exits 0, so
          # this step also challenges the suite with command lines whose answers are written out here. The
          # expectations are longhand in both callers on purpose: a challenge is only a challenge if the party
          # asking holds the answer independently. Row 1 is the live unrelated Node process that holds this
          # port on the author's workstation and must never be judged ours - FALSE in every world, as are rows
          # 2 and 3. Row 2 carries a doubled quote and is refused before any path is resolved, which is the one
          # row here that genuinely never reaches the resolver; rows 1 and 3 are FALSE by prefix arithmetic
          # instead, and their off-Windows verdict is not an argument but an observation - this job runs on
          # ubuntu and asserts them. The earlier wording claimed all three were refused ahead of the resolver,
          # which was true of one of them. Row 0 is `ResolverDependent`: TRUE on Windows, and off Windows this step requires
          # the exact argv and requires an answer, but does not claim which verdict is right, because nobody
          # has measured .NET's GetFullPath on Linux against this predicate. This job is ubuntu-latest, so that
          # unclaimed case is the one that applies here, and the manifest states which world ran.
          # The last two rows carry a NONCE that differs on every run. The four fixed rows can be satisfied by a
          # stub that hard-codes their answers without ever running the predicate - the same shape of defeat this
          # challenge exists to catch one layer up - and a nonce cannot be hard-coded. Hexadecimal only, so no
          # space, quote or backslash, which is why the expected argv is plain concatenation and this step never
          # re-implements the tokenizer. It reaches no product code, database or artifact, so the season proof's
          # determinism is untouched.
          # ReadOnly, because a fresh-context review confirmed that `${script:nonce} = 'fixed'` written after
          # this line overwrites the value while the guard's single-assignment count still reads one - the
          # count is a JavaScript regex over PowerShell, whose variable names are case-insensitive and
          # spellable several ways. PowerShell itself refuses the second write at runtime; a fixed nonce would
          # let the whole challenge be hard-coded, which is the exact defeat the nonce exists to catch.
          Set-Variable -Name nonce -Option ReadOnly -Value ([Guid]::NewGuid().ToString('N'))
          $rows = @(
            @{ Line = 'node.exe C:\FarmRx\node_modules\vite\bin\vite.js --port 4177'; Argv = '<node.exe>|<C:\FarmRx\node_modules\vite\bin\vite.js>|<--port>|<4177>'; Owned = $true; ResolverDependent = $true }
            @{ Line = '"C:\Program Files\nodejs\node.exe" scripts/factory-board.mjs --port 4177'; Argv = '<C:\Program Files\nodejs\node.exe>|<scripts/factory-board.mjs>|<--port>|<4177>'; Owned = $false; ResolverDependent = $false }
            @{ Line = 'node.exe "C:\FarmRx"" Backup"\x.js'; Argv = '<node.exe>|<C:\FarmRx">|<Backup\x.js>'; Owned = $false; ResolverDependent = $false }
            @{ Line = 'node.exe C:\FarmRx2\node_modules\vite\bin\vite.js'; Argv = '<node.exe>|<C:\FarmRx2\node_modules\vite\bin\vite.js>'; Owned = $false; ResolverDependent = $false }
            @{ Line = "node.exe C:\FarmRx\node_modules\vite\bin\vite.js --nonce $nonce"; Argv = "<node.exe>|<C:\FarmRx\node_modules\vite\bin\vite.js>|<--nonce>|<$nonce>"; Owned = $true; ResolverDependent = $true }
            @{ Line = "node.exe C:\Other\server.js --nonce $nonce"; Argv = "<node.exe>|<C:\Other\server.js>|<--nonce>|<$nonce>"; Owned = $false; ResolverDependent = $false }
          )
          $onWindows = ($null -eq $IsWindows) -or $IsWindows
          # U+001F-joined then Base64 encoded, the same encoding the orchestrator uses. This step calls the suite
          # in-process, so it never hit the `-File` binder defects the encoding exists to survive - it matches
          # the orchestrator anyway, because two callers that encode differently would let a decode regression
          # pass on one side and fail on the other.
          # U+001F is NOT impossible in a Windows command line - passing `A<U+001F>B` to a Node child was
          # measured to arrive intact, so the earlier claim to the contrary is withdrawn. A row containing the
          # delimiter would split into phantom challenges, so the encoder refuses it rather than assuming.
          foreach ($row in $rows) {
            if ($row.Line.Contains([char]0x1F)) { throw "Ownership challenge row contains the U+001F delimiter, which would split into phantom challenges: $($row.Line)" }
          }
          $challenge = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes((($rows | ForEach-Object { $_.Line }) -join ([char]0x1F))))
          $ownership = @(./scripts/maple-season-browser-ownership.regression.ps1 -Challenge $challenge -ChallengeRoot 'C:\FarmRx')
          $ownership | ForEach-Object { Write-Output $_ }
          if ($ownership -notcontains 'MAPLE_SEASON_BROWSER_OWNERSHIP_REGRESSION_PASS') {
            throw 'Season browser ownership regression did not print its completion marker.'
          }
          $manifest = @($ownership | Where-Object { $_ -like 'OWNERSHIP_MANIFEST *' })
          if ($manifest.Count -ne 1) { throw "Season browser ownership regression printed $($manifest.Count) manifest lines instead of exactly one; it did not run to completion." }
          # `canary=caught` is the child's report that its assertion helper was handed a must-fail condition and
          # noticed. Without it this step cannot tell a run with a hundred live assertions from a run with all of
          # them silently disabled, which was measured by no-op'ing the helper and watching everything else stay
          # green.
          # `cases` is the count of assertion cases the child REACHED, and this step holds the expected number.
          # It is the field that closes what `canary=caught` could not see: the child's own cross-check compared
          # failure counts, so wrapping an assertion that normally PASSES left both channels at zero, agreeing,
          # and the child printed PASS. Measured. Five cases are portable; each Windows-only row adds one, and
          # this job is ubuntu, so five is the number here.
          # ReadOnly, because a fresh-context review pointed out that `$expected = $manifest[0]` inserted after
          # this line makes the caller compare the child's manifest with itself while every pinned string stays
          # exactly where it is. An expectation that can be overwritten by the thing it judges is not an
          # expectation. PowerShell refuses a second write to a ReadOnly variable at RUNTIME, so this is a real
          # barrier rather than another sentence for a guard to look for.
          Set-Variable -Name expected -Option ReadOnly -Value "OWNERSHIP_MANIFEST tokenizer=29 refusals=25 gutted=25 windows=$($onWindows.ToString().ToLowerInvariant()) windowsCases=$(if ($onWindows) { 24 } else { 0 }) cases=$(if ($onWindows) { 29 } else { 5 }) challenges=$($rows.Count) canary=caught"
          if ($manifest[0] -cne $expected) { throw "Season browser ownership regression reported a different shape than this step requires.`n  expected: $expected`n  reported: $($manifest[0])" }
          # Counted as INSTANCES, not searched for. Filtering this step's own candidate strings by whether the
          # output contains them measures nothing about how many lines the child printed, so a child answering
          # both TRUE and FALSE for one index, or answering twice, used to pass. A child that contradicts
          # itself has not answered.
          $answered = @($ownership | Where-Object { $_.StartsWith('OWNERSHIP_CHALLENGE ', [StringComparison]::Ordinal) })
          if ($answered.Count -ne $rows.Count) {
            throw "Season browser ownership regression printed $($answered.Count) challenge answers for $($rows.Count) challenges.`n  " + ($answered -join "`n  ")
          }
          # RECONCILED, and what is recorded is the ANSWER the comparison accepted rather than a tick. The first
          # version of this was `$verifiedAnswers++` on its own line after the comparison, and a fresh-context
          # review pointed out the obvious: wrap only the comparison and the increment still runs six times, so
          # the count reads six with nothing compared. What lands in the list below is $accepted[0] - a value
          # that exists only because the comparison ran - so a wrapped comparison leaves the list empty or
          # full of nulls, and neither reconciles against the answers the child actually printed.
          $verifiedAnswers = [Collections.Generic.List[string]]::new()
          for ($i = 0; $i -lt $rows.Count; $i++) {
            $verdicts = if ($rows[$i].ResolverDependent -and (-not $onWindows)) { @('TRUE', 'FALSE') } elseif ($rows[$i].Owned) { @('TRUE') } else { @('FALSE') }
            $candidates = @($verdicts | ForEach-Object { "OWNERSHIP_CHALLENGE $i owned=$_ argv=$($rows[$i].Argv)" })
            $forIndex = @($answered | Where-Object { $_.StartsWith("OWNERSHIP_CHALLENGE $i ", [StringComparison]::Ordinal) })
            # A `foreach` KEYWORD and a `-ccontains` OPERATOR, deliberately not a pipeline. A fresh-context
            # review demonstrated that defining a local `Where-Object` function which returns every object
            # without invoking its filter makes this line accept a printed FALSE against a candidate TRUE,
            # with the pinned source text completely unchanged. Keywords and operators cannot be shadowed by
            # a function definition; cmdlets can. The static guard separately forbids any file here from
            # defining or aliasing these cmdlet names - a PROHIBITION is sound where an affirmation is not,
            # because a shadow cannot take effect without its definition being present to find.
            $accepted = [Collections.Generic.List[string]]::new()
            foreach ($answer in $forIndex) { if ($candidates -ccontains $answer) { $accepted.Add($answer) } }
            if ($forIndex.Count -ne 1 -or $accepted.Count -ne 1) {
              throw "Season browser ownership regression did not answer challenge $i as this step requires.`n  accepted: $($candidates -join ' OR ')`n  printed: $($forIndex -join ' AND ')`n  command line: $($rows[$i].Line)"
            }
            $verifiedAnswers.Add($accepted[0])
          }
          if ((($verifiedAnswers | Sort-Object) -join "`n") -cne (($answered | Sort-Object) -join "`n")) {
            throw "Season browser ownership regression: the $($rows.Count) challenge answers this lane accepted one by one do not reconcile with the $($answered.Count) it printed, so the per-index comparison above did not run.`n  accepted:`n  $(($verifiedAnswers -join "`n  "))`n  printed:`n  $(($answered -join "`n  "))"
          }
      - name: Run foundation gate
        shell: pwsh
        # The marker assertion stays, downgraded in what it claims. It catches a truncated or crashed run
        # that still exits 0; it does not catch a deliberate forgery, and the steps above are what cover
        # that. Tee-Object passes the output through, so the gate still streams to the job log.
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/verify-foundation.ps1 | Tee-Object -FilePath foundation-gate.log
          if (-not (Select-String -LiteralPath foundation-gate.log -SimpleMatch -CaseSensitive -Pattern 'Farm Rx foundation gate: PASS' -Quiet)) {
            throw 'Foundation gate did not print its completion marker.'
          }
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
