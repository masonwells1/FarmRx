name: Farm Rx foundation gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: CodeRabbit final-review gate regression tests
        run: node .github/scripts/coderabbit-final-review.test.cjs
      - name: Agent guidance contract
        run: npm run test:agent-guidance
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run foundation gate
        shell: pwsh
        run: ./scripts/verify-foundation.ps1
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
