name: USDA MARS basis feed

# GL-1: pull the daily USDA cash-grain-bid reports once per market day. 4:30 PM and a
# 7:00 PM retry, Chicago time, on weekdays; both UTC offsets are listed because cron
# runs in UTC, and the function is idempotent so the extra hour is harmless.
on:
  schedule:
    - cron: '30 21,22 * * 1-5'
    - cron: '0 0,1 * * 2-6'
  workflow_dispatch:

concurrency:
  group: farm-rx-usda-mars-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke the server-owned USDA MARS feed
        env:
          FEED_URL: ${{ secrets.FARM_RX_MARS_FEED_URL }}
          SCHEDULER_KEY: ${{ secrets.FARM_RX_SCHEDULER_SECRET }}
          SUPABASE_ANON_KEY: ${{ secrets.FARM_RX_SUPABASE_ANON_KEY }}
        run: |
          test -n "$FEED_URL" && test -n "$SCHEDULER_KEY" && test -n "$SUPABASE_ANON_KEY"
          curl --fail-with-body --retry 2 --retry-all-errors \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "x-scheduler-key: $SCHEDULER_KEY" \
            --header "content-type: application/json" \
            --request POST --data '{}' "$FEED_URL"

      # GL-2 (b): evaluate the rules against the bids this run just ingested, instead of waiting up to
      # fifteen minutes for the sweep's own cron. The sweep takes an advisory lock and reports
      # 'already_running' if its cron overlaps, so this extra call can never double-send an alert.
      # It runs only after the feed step succeeded; a failed feed leaves the cron to do its usual work.
      - name: Evaluate marketing alerts against the bids just ingested
        env:
          SCHEDULER_URL: ${{ secrets.FARM_RX_SCHEDULER_URL }}
          SCHEDULER_KEY: ${{ secrets.FARM_RX_SCHEDULER_SECRET }}
          SUPABASE_ANON_KEY: ${{ secrets.FARM_RX_SUPABASE_ANON_KEY }}
        run: |
          test -n "$SCHEDULER_URL" && test -n "$SCHEDULER_KEY" && test -n "$SUPABASE_ANON_KEY"
          curl --fail-with-body --retry 2 --retry-all-errors \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "x-scheduler-key: $SCHEDULER_KEY" \
            --header "content-type: application/json" \
            --request POST --data '{}' "$SCHEDULER_URL"
